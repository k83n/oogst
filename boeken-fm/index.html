<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oogst — Boeken FM</title>
<meta name="robots" content="noindex, nofollow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Oogst">
<meta property="og:title" content="Oogst — Boeken FM">
<meta property="og:description" content="2 oogsten uit Boeken FM, nieuwste eerst.">
<meta property="og:image" content="https://k83n.github.io/oogst/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --bg:#12100d; --kaart:#1c1915; --rand:#2c2822; --tekst:#ece5d8; --dim:#a89f8d; --accent:#e8b04b; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--tekst); font-family:Inter,-apple-system,sans-serif; line-height:1.55; -webkit-font-smoothing:antialiased; }
header { padding:46px 20px 20px; text-align:center; background:radial-gradient(ellipse 90% 120% at 50% -20%,#3a2c14 0%,transparent 60%),var(--bg); }
.logo { width:72px; height:72px; margin:0 auto 10px; display:block; }
.boventitel { color:var(--accent); font-size:13px; letter-spacing:.25em; text-transform:uppercase; font-weight:600; }
h1 { font-family:Fraunces,Georgia,serif; font-weight:700; font-size:clamp(30px,7vw,46px); margin:8px 0 6px; }
header p { color:var(--dim); font-size:15px; max-width:520px; margin:0 auto; }
a.rss { display:inline-block; margin-top:14px; color:var(--dim); text-decoration:none; font-size:12.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; border:1px solid var(--rand); border-radius:999px; padding:4px 12px; }
a.rss:hover { color:var(--accent); border-color:var(--accent); }
main { max-width:680px; margin:0 auto; padding:14px 18px 60px; }
a.kaart { display:flex; align-items:center; gap:16px; text-decoration:none; background:var(--kaart); border:1px solid var(--rand); border-radius:14px; padding:16px 18px; margin:12px 0; color:var(--tekst); }
a.kaart:hover { border-color:var(--accent); }
.kaart-beeld { width:52px; height:52px; border-radius:10px; flex:none; object-fit:cover; border:1px solid var(--rand); background:var(--rand); }
.kaart-inhoud { flex:1; min-width:0; }
a.kaart .kaart-kop { display:flex; align-items:center; justify-content:space-between; gap:10px; }
a.kaart .pod { color:var(--accent); font-size:12.5px; letter-spacing:.12em; text-transform:uppercase; font-weight:600; }
a.kaart .badge { color:var(--dim); font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; font-weight:600; border:1px solid var(--rand); border-radius:999px; padding:2px 9px; white-space:nowrap; }
a.kaart h2 { font-family:Fraunces,Georgia,serif; font-weight:600; font-size:20px; margin:4px 0 2px; }
a.kaart .datum { color:var(--dim); font-size:13.5px; }
.zoek { margin:18px auto 0; max-width:340px; }
.zoek input { width:100%; background:var(--kaart); border:1px solid var(--rand); border-radius:999px; color:var(--tekst); font:400 14px Inter,sans-serif; padding:9px 16px; -webkit-appearance:none; }
.zoek input::placeholder { color:var(--dim); }
.zoek input:focus { outline:none; border-color:var(--accent); }
.telling { text-align:center; color:var(--dim); font-size:12.5px; margin-top:10px; min-height:1.2em; }
.raak { color:var(--dim); font-size:12.5px; margin-top:5px; }
.raak b { color:var(--accent); font-weight:600; }
/* stipje vóór de shownaam bij een oogst die nog niet geopend is */
.nieuw::before { content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--accent); margin-right:7px; vertical-align:2px; }
.filters { margin-top:20px; display:flex; justify-content:center; gap:8px; flex-wrap:wrap; }
.chip { background:none; cursor:pointer; color:var(--dim); font:600 12.5px Inter,sans-serif; letter-spacing:.06em; text-transform:uppercase; border:1px solid var(--rand); border-radius:999px; padding:5px 14px; }
.chip:hover { color:var(--accent); border-color:var(--accent); }
.chip.actief { color:var(--bg); background:var(--accent); border-color:var(--accent); }
.terug { text-align:left; max-width:680px; margin:0 auto 14px; }
.terug a { color:var(--dim); text-decoration:none; font-size:13.5px; font-weight:500; }
.terug a:hover { color:var(--accent); }
.maand { font-family:Fraunces,Georgia,serif; font-weight:600; font-size:15px; color:var(--dim); margin:30px 0 4px; letter-spacing:.04em; text-transform:uppercase; }
.sterren { color:var(--accent); letter-spacing:2.5px; }
.archief { text-align:center; color:var(--dim); font-size:13px; margin-top:40px; }
.archief a { color:var(--dim); text-decoration:underline; text-decoration-color:var(--rand); text-underline-offset:3px; }
.archief a:hover { color:var(--accent); }
/* Portaal: de ingangen naast de feed. Alleen de index vult {ingangen}. */
.ingangen { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:4px 0 30px; }
a.ingang { display:block; text-decoration:none; color:var(--tekst); background:var(--kaart); border:1px solid var(--rand); border-radius:14px; padding:14px 15px; }
a.ingang:hover { border-color:var(--accent); }
a.ingang .teken { color:var(--accent); font-size:17px; line-height:1; }
/* de feed is de brede ingang onder de vier andere, niet een vijfde weesje */
a.ingang.breed { grid-column:1 / -1; }
a.ingang h2 { font-family:Fraunces,Georgia,serif; font-weight:600; font-size:17px; margin:7px 0 3px; }
a.ingang p { color:var(--dim); font-size:13px; margin:0; }
.sectiekop { font-family:Fraunces,Georgia,serif; font-weight:600; font-size:15px; color:var(--dim); margin:0 0 2px; letter-spacing:.04em; text-transform:uppercase; }
/* Op het portaal staan álle kaarten in de pagina (zoeken en filteren moeten
   over het hele jaar werken), maar in rust tonen we alleen de nieuwste —
   plus wat nog niet geopend is; dat laatste haalt de klasse er in JS af.
   Let op de selector: 'a.kaart' zet display:flex en wint qua specificiteit
   van een kale '.later', dus die moet even specifiek zijn. */
a.kaart.later { display:none; }
</style>
</head>
<body>
<header>
  <nav class="terug"><a href="../">← Oogst</a></nav><img class="logo" src="../logo.svg" alt="" width="72" height="72">
  <div class="boventitel">Oogst</div>
  <h1>Boeken FM</h1>
  <p>2 oogsten uit Boeken FM, nieuwste eerst.</p>
  
  
  
</header>
<main>
<div class="telling" id="telling"></div>
<h2 class="maand" id="m-2026-08" data-maand="2026-08">Augustus 2026</h2>
  <a class="kaart" href="2026-08-03.html" data-domein="boeken" data-maand="2026-08">
    <img class="kaart-beeld" src="https://www.omnycontent.com/d/playlist/61ee9ca4-a1b2-4660-9651-b2b70035edf5/e6e46e6b-430a-4c7a-8a8d-b30c0070083a/ae45be2f-1b95-406b-bc4e-b30c00700849/image.jpg?t=1769584892&amp;size=Large" alt="" loading="lazy"><div class="kaart-inhoud">
    <div class="kaart-kop"><span></span><span class="badge">boeken</span></div>
    <h2>Zomerverrassing | Elena Ferrante - De verborgen dochter</h2>
    <div class="datum">3 augustus 2026</div>
    </div>
  </a>
<h2 class="maand" id="m-2026-07" data-maand="2026-07">Juli 2026</h2>
  <a class="kaart" href="2026-07-08.html" data-domein="boeken" data-maand="2026-07">
    <img class="kaart-beeld" src="https://www.omnycontent.com/d/playlist/61ee9ca4-a1b2-4660-9651-b2b70035edf5/e6e46e6b-430a-4c7a-8a8d-b30c0070083a/ae45be2f-1b95-406b-bc4e-b30c00700849/image.jpg?t=1769584892&amp;size=Large" alt="" loading="lazy"><div class="kaart-inhoud">
    <div class="kaart-kop"><span></span><span class="badge">boeken</span></div>
    <h2>Joosts Franse college | Patrick Modiano — Huwelijksreis</h2>
    <div class="datum">8 juli 2026</div>
    </div>
  </a>
</main>
<script>
(function () {
  var domein = 'alles', term = '', index = null;
  var veld = document.getElementById('zoekveld');
  var telling = document.getElementById('telling');

  // de zoekindex bevat per post de besproken namen (artiesten, films,
  // games, albums, nummers); zonder die index zoekt het veld alleen op
  // shownaam en afleveringstitel
  if (veld) {
    fetch('../zoekindex.json', { cache: 'no-cache' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d) return;
        index = {};
        d.forEach(function (p) {
          index[p.p] = { namen: p.n || [], extra: p.x || [] };
        });
        if (term) pasToe();
      })
      .catch(function () { /* stil: zoeken op titel blijft werken */ });
  }

  function norm(s) {
    return (s || '').normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
      .toLowerCase();
  }

  function treffers(kaart) {
    // geeft de namen die matchen, zodat de kaart kan tonen wáárom hij er staat
    var info = index && index[kaart.getAttribute('href')];
    if (!info) return [];
    return info.namen.concat(info.extra).filter(function (n) {
      return norm(n).indexOf(term) !== -1;
    });
  }

  function pasToe() {
    var zichtbaar = {}, aantal = 0;
    // In rust (geen zoekterm, geen domeinfilter) toont het portaal alleen de
    // nieuwste kaarten; zodra er gezocht of gefilterd wordt doet het hele
    // jaar mee. Op de archief- en showpagina's heeft geen kaart '.later',
    // dus daar verandert er niets.
    var rust = !term && domein === 'alles';
    document.querySelectorAll('a.kaart').forEach(function (k) {
      var okDomein = domein === 'alles'
        || k.dataset.domein.split(' ').indexOf(domein) !== -1;
      var raak = [];
      var okTerm = !term;
      if (!okTerm) {
        okTerm = norm(k.textContent).indexOf(term) !== -1;
        raak = treffers(k);
        if (raak.length) okTerm = true;
      }
      var toon = okDomein && okTerm
        && !(rust && k.classList.contains('later'));
      // expliciet 'flex', niet '': bij een leegmaken zou de CSS-regel
      // a.kaart.later een gevonden kaart alsnog verbergen
      k.style.display = toon ? 'flex' : 'none';
      if (toon) { zichtbaar[k.dataset.maand] = true; aantal++; }

      var oud = k.querySelector('.raak');
      if (oud) oud.remove();
      if (toon && raak.length) {
        var el = document.createElement('div');
        el.className = 'raak';
        el.innerHTML = 'gevonden: <b>' + raak.slice(0, 3).map(function (n) {
          return n.replace(/[&<>]/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
          });
        }).join('</b> · <b>') + '</b>'
          + (raak.length > 3 ? ' <span>+' + (raak.length - 3) + '</span>' : '');
        (k.querySelector('.kaart-inhoud') || k).appendChild(el);
      }
    });
    document.querySelectorAll('.maand').forEach(function (h) {
      h.style.display = zichtbaar[h.dataset.maand] ? '' : 'none';
    });
    if (telling) {
      telling.textContent = term
        ? (aantal ? aantal + (aantal === 1 ? ' oogst' : ' oogsten') + ' gevonden'
                  : 'niets gevonden voor “' + veld.value.trim() + '”')
        : '';
    }
  }

  // Nog-niet-geopend-markering. Volledig vanaf de index: een klik op een
  // kaart telt als gezien, zodat de postpagina's zelf niets hoeven te doen.
  // Eerste bezoek = nulmeting (alles als gezien wegschrijven), anders zou
  // het hele archief in één keer als nieuw oplichten.
  var SLEUTEL = 'oogst:gezien';
  try {
    var kaarten = [].slice.call(document.querySelectorAll('a.kaart'));
    var paden = kaarten.map(function (k) { return k.getAttribute('href'); });
    var opgeslagen = localStorage.getItem(SLEUTEL);
    var gezien = opgeslagen ? JSON.parse(opgeslagen) : null;
    if (!gezien) {
      localStorage.setItem(SLEUTEL, JSON.stringify(paden));
    } else {
      kaarten.forEach(function (k) {
        if (gezien.indexOf(k.getAttribute('href')) === -1) {
          var pod = k.querySelector('.pod');
          if (pod) pod.classList.add('nieuw');
          // Op het portaal: wat nog niet geopend is hoort zichtbaar te zijn,
          // ook als het buiten de nieuwste paar valt. Anders verstopt de
          // inkorting juist datgene waarvoor je kwam.
          k.classList.remove('later');
        }
      });
      kaarten.forEach(function (k) {
        k.addEventListener('click', function () {
          var pad = k.getAttribute('href');
          if (gezien.indexOf(pad) === -1) {
            gezien.push(pad);
            localStorage.setItem(SLEUTEL, JSON.stringify(gezien));
          }
        });
      });
    }
  } catch (e) { /* privémodus o.i.d.: dan gewoon geen markering */ }

  document.querySelectorAll('.chip').forEach(function (chip) {
    chip.addEventListener('click', function () {
      document.querySelectorAll('.chip').forEach(function (c) {
        c.classList.toggle('actief', c === chip);
      });
      domein = chip.dataset.domein;
      pasToe();
    });
  });
  if (veld) {
    veld.addEventListener('input', function () {
      term = norm(veld.value.trim());
      pasToe();
    });
  }
})();
</script>
</body>
</html>
